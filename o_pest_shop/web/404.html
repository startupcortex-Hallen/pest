<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>O Pest - Shop</title>
  <script>
    (function () {
      var path = window.location.pathname;
      var seg = path.split('/');
      var base = seg.slice(0, seg.length - 1).join('/');
      window.location.replace(base + '/'); 
    })();
  </script>
</head>
<body>
  <p>Redirecionando para O Pest - Shop...</p>
</body>
</html>
