name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Analyze (falha apenas em erros)
        working-directory: o_pest_shop
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes
        working-directory: o_pest_shop
        run: flutter test

      - name: Build web
        working-directory: o_pest_shop
        run: flutter build web --release --base-href /pest/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: o_pest_shop/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4