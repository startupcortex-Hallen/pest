name: Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true

      - name: Analyze (falha apenas em erros)
        working-directory: o_pest_shop
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes
        working-directory: o_pest_shop
        run: flutter test

      - name: Gerar catálogo estático
        working-directory: o_pest_shop
        run: node scripts/gerar-catalogo.mjs

      - name: Build web
        working-directory: o_pest_shop
        run: flutter build web --release --base-href /pest/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: o_pest_shop/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verificar credenciais Cloudflare
        id: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare Pages::Configure CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID para publicar em o-pest-shop.pages.dev."
          fi

      - uses: actions/checkout@v4
        if: steps.cloudflare.outputs.enabled == 'true'

      - uses: subosito/flutter-action@v2
        if: steps.cloudflare.outputs.enabled == 'true'
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true

      - name: Gerar catálogo estático
        if: steps.cloudflare.outputs.enabled == 'true'
        working-directory: o_pest_shop
        run: node scripts/gerar-catalogo.mjs

      - name: Build web (raiz)
        if: steps.cloudflare.outputs.enabled == 'true'
        working-directory: o_pest_shop
        run: flutter build web --release --base-href /

      - name: Publicar no Cloudflare Pages
        if: steps.cloudflare.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy o_pest_shop/build/web --project-name=o-pest-shop --branch=main